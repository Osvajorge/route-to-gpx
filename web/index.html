<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Route to GPX</title>
    <meta
      name="description"
      content="Paste a Komoot or Wikiloc link and get a GPX file plus the measurements behind it: distance, ascent, and where the recording has holes."
    />
    <meta name="color-scheme" content="dark" />
    <!-- No Referrer-Policy on purpose: the OpenStreetMap tile usage policy asks
         that a valid Referer reaches them, and a strict policy is a silent way
         to get the basemap blocked. -->
    <meta name="theme-color" content="#0d1014" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1014'/%3E%3Cpath d='M6 22 12 12l5 6 3-4 6 8' fill='none' stroke='%236fd7f5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>

  <body>
    <a class="skip-link" href="#tabs">Skip to the tabs</a>

    <div class="shell">
      <header class="masthead">
        <span class="wordmark">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false" class="mark">
            <path
              d="M5 23 12 11l5 7 3-4.5L27 22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Route&nbsp;to&nbsp;GPX
        </span>
        <button id="lang-toggle" class="ghost-button" type="button"></button>
      </header>

      <main id="app" data-view="idle">
        <section class="step" id="step-one" aria-labelledby="step1-heading">
          <!-- Three ways of arriving at one URL, not three products. Whichever
               tab is open, the route still goes through the same conversion. -->
          <div class="tabs" id="tabs" role="tablist" tabindex="-1">
            <button
              class="tab"
              id="tab-search"
              type="button"
              role="tab"
              data-tab="search"
              aria-controls="panel-search"
            ></button>
            <button
              class="tab"
              id="tab-nearby"
              type="button"
              role="tab"
              data-tab="nearby"
              aria-controls="panel-nearby"
            ></button>
            <button
              class="tab"
              id="tab-link"
              type="button"
              role="tab"
              data-tab="link"
              aria-controls="panel-link"
            ></button>
          </div>

          <div class="card">
            <h1 id="step1-heading"></h1>

            <section
              class="panel"
              id="panel-search"
              role="tabpanel"
              aria-labelledby="tab-search"
              tabindex="0"
            >
              <p class="lede" id="sub-search"></p>
              <form class="finder-form" id="search-form">
                <p class="control">
                  <label class="control-label" for="search-query"></label>
                  <input class="text-input" id="search-query" type="search" autocomplete="off" />
                </p>
                <div class="control-grid">
                  <p class="control">
                    <label class="control-label" for="search-source"></label>
                    <span class="select-shell"><select class="select" id="search-source"></select></span>
                  </p>
                  <p class="control">
                    <label class="control-label" for="search-sport"></label>
                    <span class="select-shell"><select class="select" id="search-sport"></select></span>
                  </p>
                  <button class="primary-button submit-button" id="search-submit" type="submit"></button>
                </div>
                <!-- Shown only for a source whose own activity filter is
                     refused to callers without an account, so the dropdown
                     never claims work the source did not do. -->
                <p class="field-note" id="search-activity-note" hidden></p>
              </form>
              <div class="finder-out" id="search-out"></div>
            </section>

            <section
              class="panel"
              id="panel-nearby"
              role="tabpanel"
              aria-labelledby="tab-nearby"
              tabindex="0"
            >
              <p class="lede" id="sub-nearby"></p>

              <!-- Both ways of filling the two coordinate fields sit outside the
                   form: the place panel has a field and a button of its own, and
                   a form cannot hold another one. -->
              <div class="pick-row">
                <button class="ghost-button" id="geo-here" type="button"></button>
                <button
                  class="ghost-button"
                  id="place-open"
                  type="button"
                  aria-expanded="false"
                  aria-controls="place-panel"
                ></button>
              </div>
              <p class="geo-note" id="geo-note" role="status"></p>

              <div class="place-panel" id="place-panel" hidden>
                <h2 id="place-title"></h2>
                <div class="place-field">
                  <label class="control-label" for="place-query"></label>
                  <input class="text-input" id="place-query" type="search" autocomplete="off" />
                  <button class="ghost-button" id="place-find" type="button"></button>
                </div>
                <div class="place-out" id="place-out"></div>
                <button class="link-button" id="place-close" type="button"></button>
              </div>

              <form class="finder-form" id="nearby-form">
                <div class="control-grid">
                  <p class="control">
                    <label class="control-label" for="nearby-lat"></label>
                    <input class="text-input" id="nearby-lat" type="text" inputmode="decimal" autocomplete="off" />
                  </p>
                  <p class="control">
                    <label class="control-label" for="nearby-lng"></label>
                    <input class="text-input" id="nearby-lng" type="text" inputmode="decimal" autocomplete="off" />
                  </p>
                  <p class="control">
                    <label class="control-label" for="nearby-radius"></label>
                    <span class="select-shell"><select class="select" id="nearby-radius"></select></span>
                  </p>
                  <p class="control">
                    <label class="control-label" for="nearby-source"></label>
                    <span class="select-shell"><select class="select" id="nearby-source"></select></span>
                  </p>
                  <p class="control">
                    <label class="control-label" for="nearby-sport"></label>
                    <span class="select-shell"><select class="select" id="nearby-sport"></select></span>
                  </p>
                  <button class="primary-button submit-button" id="nearby-submit" type="submit"></button>
                </div>
                <p class="field-note" id="nearby-activity-note" hidden></p>
              </form>
              <div class="finder-out" id="nearby-out"></div>
            </section>

            <section
              class="panel"
              id="panel-link"
              role="tabpanel"
              aria-labelledby="tab-link"
              tabindex="0"
            >
              <p class="lede" id="sub-link"></p>

              <div class="field">
                <span class="field-prefix"></span>
                <input id="route-url" type="url" spellcheck="false" autocomplete="off" />
                <button id="paste" class="ghost-button" type="button"></button>
                <button id="convert" class="primary-button" type="button"></button>
              </div>

              <p class="hint" id="step1-hint"></p>
              <button id="example" class="link-button" type="button"></button>
            </section>

            <ol id="progress" class="stages" aria-live="polite" hidden></ol>
            <div id="error" class="panel-warn" role="alert" hidden></div>
          </div>
        </section>

        <section class="step" id="report" aria-labelledby="report-title" hidden>
          <div class="card report-head">
            <div class="report-identity">
              <h1 id="report-title"></h1>
              <p class="source-line" id="report-source"></p>
            </div>
            <div class="report-actions">
              <button id="download" class="primary-button" type="button"></button>
              <button id="reset" class="link-button" type="button"></button>
            </div>
          </div>

          <div id="tiles" class="tiles"></div>

          <figure class="chart" id="trace">
            <figcaption class="chart-head">
              <span class="chart-title"></span>
              <span class="chart-head-end">
                <span class="chart-reading"></span>
                <button id="map-toggle" class="chart-toggle" type="button"></button>
              </span>
            </figcaption>
            <!-- The map canvas and the two overlay spans are siblings of
                 .chart-svg, never children of it: app.js replaces the drawing by
                 setting .chart-svg's innerHTML, which would wipe anything inside
                 it. -->
            <div class="chart-canvas">
              <canvas class="chart-map" aria-hidden="true" hidden></canvas>
              <div class="chart-svg"></div>
              <span class="gap-label" hidden></span>
              <span class="chart-tooltip" hidden></span>
              <span class="chart-attribution" hidden></span>
            </div>
            <div class="chart-caption"></div>
          </figure>

          <figure class="chart" id="profile">
            <figcaption class="chart-head">
              <span class="chart-title"></span>
              <span class="chart-reading"></span>
            </figcaption>
            <!-- The axis numbers live in gutters beside the plot, not inside the
                 SVG: this chart is drawn with preserveAspectRatio="none", which
                 stretches glyphs out of shape. Keeping .chart-canvas as the plot
                 rectangle, edge to edge, is also what keeps the pointer mapping
                 and charts.js px() the same linear map. -->
            <div class="chart-plot">
              <div class="axis-y" aria-hidden="true"></div>
              <div class="chart-canvas"><div class="chart-svg"></div></div>
              <div class="axis-x" aria-hidden="true"></div>
            </div>
          </figure>

          <div id="warning" class="panel-warn warning-line" role="status" hidden></div>

          <dl id="secondary" class="secondary"></dl>
          <p id="provenance" class="provenance"></p>
        </section>
      </main>

      <footer class="colophon">
        <p id="footer-processing"></p>
        <a
          id="footer-source"
          href="https://github.com/Osvajorge/route-to-gpx"
          rel="noopener"
        ></a>
      </footer>
    </div>

    <div class="drop-veil" aria-hidden="true"><span class="drop-note"></span></div>

    <script type="module" src="assets/app.js"></script>
  </body>
</html>
